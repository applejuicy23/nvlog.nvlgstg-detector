name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build NvlogDetector.slnx -c Release
      - name: Core tests
        run: dotnet test tests/NvlogDetector.Tests/NvlogDetector.Tests.csproj -c Release --no-build --logger trx
      - name: WPF filters and sorting
        run: dotnet run --project tests/NvlogDetector.UiTests/NvlogDetector.UiTests.csproj -c Release --no-build
      - name: Package Windows x64 app
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nvlog-detector-win-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nvlog-detector-win-x64
          path: release
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/NvlogDetector/NvlogDetector.csproj
          if ($env:GITHUB_REF_NAME -ne "v$($project.Project.PropertyGroup.Version)") {
            throw 'Tag does not match the application version.'
          }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release create "$env:GITHUB_REF_NAME" @files --verify-tag --generate-notes --title "nvlog detector $env:GITHUB_REF_NAME"
